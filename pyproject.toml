[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "network-troubleshooting-agent"
version = "0.1.0"
description = "AI-driven network troubleshooting agent for KVM virtualization environments"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["network", "troubleshooting", "agent", "kvm", "ebpf", "bcc"]
authors = [
    { name = "Network Ops Team" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",

    # Claude Agent SDK
    "claude-agent-sdk>=0.1.0",

    # SSH execution
    "paramiko>=3.4.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.0.0",

    # Data validation
    "pydantic>=2.5.0",

    # Async support
    "anyio>=4.0.0",

    # Configuration
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
api = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0",
]

[project.scripts]
network-ops-agent = "cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src", "cli"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
